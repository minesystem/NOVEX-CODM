<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NØV3X — Leaderboard</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #08060d;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    header {
      padding: 22px 18px;
      text-align: center;
      border-bottom: 1px solid #241637;
      background: #0d0915;
    }

    header h1 {
      color: #b66cff;
      font-size: 28px;
      letter-spacing: 3px;
    }

    header p {
      color: #8f849c;
      margin-top: 6px;
      font-size: 13px;
    }

    .container {
      width: 94%;
      max-width: 700px;
      margin: 20px auto;
    }

    .title {
      margin-bottom: 15px;
    }

    .title h2 {
      font-size: 22px;
    }

    .title span {
      color: #a85cff;
    }

    .board {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px;
      background: #100b18;
      border: 1px solid #28183a;
      border-radius: 14px;
      box-shadow: 0 0 15px rgba(145, 61, 255, 0.08);
    }

    .rank {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #1c1129;
      color: #b66cff;
      font-weight: bold;
      font-size: 17px;
      flex-shrink: 0;
    }

    .team-info {
      flex: 1;
      min-width: 0;
    }

    .team-name {
      font-weight: bold;
      font-size: 16px;
      word-break: break-word;
    }

    .team-label {
      color: #766b80;
      font-size: 11px;
      margin-top: 4px;
    }

    .points {
      color: #c58cff;
      font-size: 18px;
      font-weight: bold;
      white-space: nowrap;
    }

    .empty {
      text-align: center;
      padding: 35px 15px;
      color: #766b80;
      background: #100b18;
      border-radius: 14px;
      border: 1px solid #28183a;
    }

    .loading {
      text-align: center;
      color: #a85cff;
      padding: 30px;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: #0d0915;
      border-top: 1px solid #28183a;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
    }

    nav a {
      text-decoration: none;
      color: #817589;
      font-size: 11px;
      text-align: center;
    }

    nav a.active {
      color: #b66cff;
    }

    nav div {
      font-size: 21px;
      margin-bottom: 3px;
    }
  </style>
</head>

<body>

  <header>
    <h1>NØV3X</h1>
    <p>ONE SQUAD, ONE FATE</p>
  </header>

  <main class="container">

    <div class="title">
      <h2>🏆 <span>LEADERBOARD</span></h2>
    </div>

    <div id="board" class="board">
      <div class="loading">Loading leaderboard...</div>
    </div>

  </main>

  <nav>
    <a href="index.html">
      <div>⌂</div>
      Home
    </a>

    <a href="chat.html">
      <div>💬</div>
      Chat
    </a>

    <a href="scrimmage.html">
      <div>⚔</div>
      Scrim
    </a>

    <a href="leaderboard.html" class="active">
      <div>🏆</div>
      Rank
    </a>

    <a href="profile.html">
      <div>👤</div>
      Profile
    </a>
  </nav>

  <script>
    const board = document.getElementById("board");

    let unsubscribeLeaderboard = null;

    auth.onAuthStateChanged(async (user) => {

      if (!user) {
        window.location.href = "login.html";
        return;
      }

      loadLeaderboard();
    });

    function loadLeaderboard() {

      if (unsubscribeLeaderboard) {
        unsubscribeLeaderboard();
      }

      unsubscribeLeaderboard = db
        .collection("leaderboard")
        .onSnapshot(
          (snapshot) => {

            board.innerHTML = "";

            if (snapshot.empty) {
              board.innerHTML = `
                <div class="empty">
                  No leaderboard data yet.
                </div>
              `;
              return;
            }

            const teams = [];

            snapshot.forEach((doc) => {

              const data = doc.data();

              teams.push({
                id: doc.id,
                name: data.name || doc.id,
                points: Number(data.points) || 0
              });

            });

            teams.sort((a, b) => b.points - a.points);

            teams.forEach((team, index) => {

              const rank = index + 1;

              const item = document.createElement("div");
              item.className = "team";

              item.innerHTML = `
                <div class="rank">
                  ${rank}
                </div>

                <div class="team-info">
                  <div class="team-name">
                    ${escapeHTML(team.name)}
                  </div>

                  <div class="team-label">
                    NØV3X SCRIMMAGE
                  </div>
                </div>

                <div class="points">
                  ${team.points} pts
                </div>
              `;

              board.appendChild(item);
            });
          },

          (error) => {

            console.error(error);

            board.innerHTML = `
              <div class="empty">
                Failed to load leaderboard.
                <br><br>
                ${escapeHTML(error.message)}
              </div>
            `;
          }
        );
    }

    function escapeHTML(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>

</body>
</html>
