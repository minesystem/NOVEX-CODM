<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>NØV3X — Leaderboard</title>

<style>

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

html {
  background:#07000d !important;
}

body {
  background:#07000d !important;
  color:white;
  min-height:100vh;
  padding-bottom:90px;
}

/* HEADER */

header {
  height:65px;
  display:flex;
  align-items:center;
  gap:15px;
  padding:0 18px;

  background:#0d0018 !important;
  border-bottom:1px solid #542677;

  position:sticky;
  top:0;
  z-index:20;
}

.back {
  color:white;
  text-decoration:none;
  font-size:26px;
}

header h1 {
  font-size:17px;
  letter-spacing:2px;
}


/* MAIN */

main {
  width:100%;
  max-width:700px;
  margin:auto;
  padding:20px;
}


/* TITLE */

.title {
  margin-bottom:20px;
}

.title p {
  color:#a650df;
  font-size:10px;
  font-weight:bold;
  letter-spacing:2px;
}

.title h2 {
  font-size:25px;
  margin-top:5px;
}


/* TOP THREE */

.top-three {
  display:grid;
  grid-template-columns:1fr 1.15fr 1fr;
  gap:8px;
  align-items:end;
  margin-bottom:25px;
}

.top-card {
  text-align:center;
  padding:15px 8px;

  background:#100b17;
  border:1px solid #291637;
  border-radius:14px;

  min-width:0;
}

.top-card.first {
  padding-top:25px;

  border-color:#75409b;

  background:
    linear-gradient(
      145deg,
      #21102d,
      #100b17
    );
}

.medal {
  font-size:27px;
  margin-bottom:8px;
}

.rank {
  color:#9d50df;
  font-size:10px;
  font-weight:bold;
  margin-bottom:7px;
}

.team-name {
  font-size:11px;
  font-weight:bold;
  word-break:break-word;
}

.points {
  color:#b45cff;
  font-size:16px;
  font-weight:bold;
  margin-top:8px;
}

.pts-label {
  color:#666;
  font-size:8px;
}


/* FULL RANKING */

.section-title {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.section-title h2 {
  font-size:15px;
  letter-spacing:1px;
}

.section-title span {
  color:#b45cff;
  font-size:9px;
  font-weight:bold;
}

.team-row {
  display:flex;
  align-items:center;

  padding:16px;
  margin-bottom:8px;

  border-radius:11px;

  background:#100b17;
  border:1px solid #291637;
}

.team-row.top-one {
  border-color:#75409b;
}

.position {
  width:40px;
  color:#9d50df;
  font-weight:bold;
  font-size:12px;
}

.team-info {
  flex:1;
  min-width:0;
}

.team-info h3 {
  font-size:13px;
  word-break:break-word;
}

.team-info p {
  color:#666;
  font-size:9px;
  margin-top:4px;
}

.score {
  text-align:right;
  margin-left:10px;
}

.score strong {
  display:block;
  font-size:14px;
  color:#ddd;
}

.score span {
  color:#666;
  font-size:8px;
}


/* EMPTY / LOADING */

.loading {
  padding:35px 10px;
  text-align:center;
  color:#806b8d;
  font-size:12px;
}

.error {
  padding:30px 10px;
  text-align:center;
  color:#ff6b88;
  font-size:12px;
}


/* POINT SYSTEM */

.point-system {
  margin-top:25px;

  padding:18px;

  background:#100b17;

  border:1px solid #291637;

  border-radius:13px;
}

.point-system h2 {
  color:#b45cff;
  font-size:13px;
  margin-bottom:12px;
}

.point {
  display:flex;
  justify-content:space-between;

  padding:9px 0;

  border-bottom:1px solid #201329;

  font-size:11px;
}

.point:last-child {
  border-bottom:none;
}

.point span {
  color:#888;
}

.point strong {
  color:#ddd;
}


/* BOTTOM NAV */

.bottom-nav {
  position:fixed;
  left:0;
  right:0;
  bottom:0;

  height:68px;

  background:#0d0018 !important;
  border-top:1px solid #451067;

  display:flex;
  justify-content:space-around;
  align-items:center;

  z-index:50;
}

.nav-item {
  text-decoration:none;
  color:#806b8d;
  text-align:center;
  font-size:11px;
}

.nav-item.active {
  color:#c77dff;
}

.nav-icon {
  display:block;
  font-size:21px;
  margin-bottom:2px;
}


/* MOBILE */

@media (max-width:350px) {

  .top-three {
    grid-template-columns:1fr;
  }

  .top-card.first {
    order:-1;
  }

}

</style>

</head>


<body>


<header>

  <a href="index.html"
     class="back">
    ←
  </a>

  <h1>
    NØV3X LEADERBOARD

</header>


<main>


  <!-- TITLE -->

  <section class="title">

  <!-- TOP 3 -->

  <section
    id="topThree"
    class="top-three">

    <div class="top-card">

      <div class="medal">

    </div>


    <div class="top-card first">

      <div class="team-name">

      </div>

      <div class="points">
        0
      </div>

      <div class="pts-label">
        POINTS
      </div>

    </div>


    <div class="top-card">

      <div class="medal">
        🥉
      </div>

      <div class="rank">

      </div>

      <div class="team-name">

      </div>

      <div class="points">

      </div>

      <div class="pts-label">

      </div>

    </div>

  </section>


  <!-- FULL RANKING -->

  <section>

    <div class="section-title">

      </h2>

      <span>

    <div id="leaderboard">

  <!-- POINT SYSTEM -->

  <section class="point-system">

    </h2>


    <div class="point">

    <div class="point">

    <div class="point">

</main>


<!-- FINAL 5-TAB NAVIGATION -->

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>


<script>

let currentUser = null;


/* =========================
   AUTH
========================= */

auth.onAuthStateChanged(user => {

  if (!user) {

    location.href =
      "login.html";

    return;

  }

  currentUser = user;

  loadLeaderboard();

});


/* =========================
   LIVE LEADERBOARD
========================= */

function loadLeaderboard() {

  db.collection("leaderboard")
    .orderBy("points", "desc")
    .onSnapshot(snapshot => {

      const container =
        document.getElementById(
          "leaderboard"
        );


      container.innerHTML = "";


      if (snapshot.empty) {

        container.innerHTML =
          '<div class="loading">No teams on the leaderboard yet.</div>';

        updateTopThree([]);

        return;

      }


      const teams = [];


      snapshot.forEach(doc => {

        const data =
          doc.data();


        teams.push({

          id:doc.id,

          name:
            data.name ||
            doc.id,

          points:
            Number(data.points) || 0

        });

      });


      teams.sort((a,b) =>
        b.points - a.points
      );


      updateTopThree(teams);


      teams.forEach(
        (team,index) => {

          const row =
            document.createElement(
              "div"
            );

          row.className =
            "team-row";


          if (index === 0) {

            row.classList.add(
              "top-one"
            );

          }


          const position =
            document.createElement(
              "div"
            );

          position.className =
            "position";

          position.textContent =
            "#" + (index + 1);


          const info =
            document.createElement(
              "div"
            );

          info.className =
            "team-info";


          const name =
            document.createElement(
              "h3"
            );

          name.textContent =
            team.name;


          const description =
            document.createElement(
              "p"
            );

          description.textContent =
            "REGISTERED TEAM";


          info.appendChild(name);

          info.appendChild(
            description
          );


          const score =
            document.createElement(
              "div"
            );

          score.className =
            "score";


          const points =
            document.createElement(
              "strong"
            );

          points.textContent =
            team.points;


          const label =
            document.createElement(
              "span"
            );

          label.textContent =
            "PTS";


          score.appendChild(points);

          score.appendChild(label);


          row.appendChild(position);

          row.appendChild(info);

          row.appendChild(score);


          container.appendChild(row);

        }

      );

    }, error => {

      console.error(error);

      document.getElementById(
        "leaderboard"
      ).innerHTML =
        '<div class="error">Unable to load leaderboard.</div>';

    });

}


/* =========================
   TOP THREE
========================= */

function updateTopThree(teams) {

  const cards =
    document.querySelectorAll(
      ".top-card"
    );


  const positions = [
    1,
    0,
    2
  ];


  cards.forEach(
    (card,index) => {

      const team =
        teams[
          positions[index]
        ];


      const name =
        card.querySelector(
          ".team-name"
        );

      const points =
        card.querySelector(
          ".points"
        );


      if (team) {

        name.textContent =
          team.name;

        points.textContent =
          team.points;

      } else {

        name.textContent =
          "—";

        points.textContent =
          "0";

      }

    }

  );

}

</script>


</body>

</html>
