<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NØV3X — Leaderboard</title>

<style>
*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#07000d;
 color:white;
 font-family:Arial,sans-serif;
 padding-bottom:80px;
}

header{
 padding:24px 18px;
 text-align:center;
 background:#0d0015;
 border-bottom:1px solid #321650;
}

.logo{
 font-size:28px;
 font-weight:900;
 letter-spacing:4px;
 color:#c56cff;
}

.title{
 margin-top:6px;
 font-size:13px;
 color:#9b7aa8;
 letter-spacing:2px;
}

.container{
 max-width:700px;
 margin:auto;
 padding:18px;
}

.status{
 text-align:center;
 color:#806b8d;
 font-size:12px;
 margin-bottom:15px;
}

.card{
 display:flex;
 align-items:center;
 gap:13px;
 background:#100019;
 border:1px solid #321650;
 border-radius:14px;
 padding:14px;
 margin-bottom:10px;
}

.rank{
 width:42px;
 height:42px;
 border-radius:10px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#1b0828;
 color:#c56cff;
 font-size:17px;
 font-weight:900;
}

.team{
 flex:1;
}

.teamName{
 font-size:15px;
 font-weight:800;
}

.points{
 margin-top:4px;
 color:#c56cff;
 font-size:12px;
 font-weight:bold;
}

.badge{
 font-size:18px;
}

.empty{
 text-align:center;
 padding:30px;
 color:#806b8d;
}

nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:65px;
 background:#0d0015;
 border-top:1px solid #321650;
 display:flex;
 justify-content:space-around;
 align-items:center;
}

nav a{
 color:#806b8d;
 text-decoration:none;
 font-size:11px;
 text-align:center;
}

nav a.active{
 color:#c56cff;
}
</style>
</head>

<body>

<header>

<div class="logo">NØV3X</div>

<div class="title">
LEADERBOARD
</div>

</header>

<div class="container">

<div id="status" class="status">
Loading leaderboard...
</div>

<div id="leaderboard"></div>

</div>

<nav>

<a href="index.html">
🏠<br>Home
</a>

<a href="chat.html">
💬<br>Chat
</a>

<a href="scrimmage.html">
🎮<br>Scrim
</a>

<a href="leaderboard.html" class="active">
🏆<br>Rank
</a>

<a href="profile.html">
👤<br>Profile
</a>

</nav>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>


<script>

const leaderboard=
document.getElementById("leaderboard");

const status=
document.getElementById("status");


auth.onAuthStateChanged(user=>{

 if(!user){

  location.href="login.html";

  return;

 }

 loadLeaderboard();

});


function loadLeaderboard(){

 db.collection("leaderboard")
 .onSnapshot(snapshot=>{

  let teams=[];

  snapshot.forEach(doc=>{

   const data=doc.data();

   teams.push({

    id:doc.id,

    name:data.name || doc.id,

    points:Number(data.points)||0

   });

  });


  teams.sort(
   (a,b)=>b.points-a.points
  );


  if(teams.length===0){

   leaderboard.innerHTML=`
    <div class="empty">
     No leaderboard teams yet.
    </div>
   `;

   status.textContent=
    "0 TEAMS";

   return;

  }


  let html="";


  teams.forEach((team,index)=>{

   let badge="";

   if(index===0)
    badge="🥇";

   else if(index===1)
    badge="🥈";

   else if(index===2)
    badge="🥉";


   html+=`

   <div class="card">

    <div class="rank">
     #${index+1}
    </div>

    <div class="team">

     <div class="teamName">
      ${escapeHTML(team.name)}
     </div>

     <div class="points">
      ${team.points} POINTS
     </div>

    </div>

    <div class="badge">
     ${badge}
    </div>

   </div>

   `;

  });


  leaderboard.innerHTML=html;

  status.textContent=
   teams.length +
   (teams.length===1
    ? " TEAM"
    : " TEAMS"
   );

 },error=>{

  console.error(error);

  status.textContent=
   "Unable to load leaderboard.";

 });

}


function escapeHTML(text){

 const div=
 document.createElement("div");

 div.textContent=text;

 return div.innerHTML;

}

</script>

</body>
</html>
