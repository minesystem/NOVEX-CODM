<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NØV3X — Chat</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#07000d;
  color:white;
  font-family:Arial,sans-serif;
  min-height:100vh;
  padding-bottom:135px;
}

header{
  padding:22px 18px;
  background:#0d0015;
  border-bottom:1px solid #321650;
  position:sticky;
  top:0;
  z-index:5;
}

.logo{
  color:#c56cff;
  font-size:27px;
  font-weight:900;
  letter-spacing:4px;
}

.subtitle{
  margin-top:5px;
  color:#806b8d;
  font-size:11px;
  letter-spacing:2px;
}

.status{
  text-align:center;
  color:#806b8d;
  font-size:11px;
  padding:10px;
}

#messages{
  max-width:700px;
  margin:auto;
  padding:10px 15px;
}

.message{
  background:#100019;
  border:1px solid #321650;
  border-radius:12px;
  padding:11px;
  margin-bottom:9px;
}

.messageHeader{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.username{
  color:#c56cff;
  font-weight:bold;
  font-size:13px;
}

.time{
  color:#604a6b;
  font-size:9px;
}

.text{
  margin-top:6px;
  color:#eee;
  font-size:13px;
  line-height:1.4;
  word-break:break-word;
}

.system{
  text-align:center;
  color:#806b8d;
  padding:30px;
}

.composer{
  position:fixed;
  bottom:65px;
  left:0;
  right:0;
  background:#0d0015;
  border-top:1px solid #321650;
  padding:10px;
  z-index:10;
}

.composerInner{
  max-width:700px;
  margin:auto;
  display:flex;
  gap:7px;
}

#messageInput{
  flex:1;
  min-width:0;
  padding:12px;
  border-radius:9px;
  border:1px solid #321650;
  background:#08000f;
  color:white;
  outline:none;
}

#sendButton{
  width:75px;
  border:0;
  border-radius:9px;
  background:#7628c8;
  color:white;
  font-weight:bold;
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:#0d0015;
  border-top:1px solid #321650;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

nav a{
  color:#806b8d;
  text-decoration:none;
  font-size:11px;
  text-align:center;
}

nav a.active{
  color:#c56cff;
}

</style>

</head>

<body>


<header>

  <div class="logo">
    NØV3X
  </div>

  <div class="subtitle">
    COMMUNITY CHAT
  </div>

</header>


<div
  id="status"
  class="status">

  Checking session...

</div>


<div id="messages">

  <div class="system">
    Loading messages...
  </div>

</div>


<div class="composer">

  <div class="composerInner">

    <input
      id="messageInput"
      type="text"
      maxlength="500"
      placeholder="Write a message...">

    <button
      id="sendButton">
      SEND
    </button>

  </div>

</div>


<nav>

  <a href="index.html">
    🏠<br>Home
  </a>

  <a
    href="chat.html"
    class="active">
    💬<br>Chat
  </a>

  <a href="scrimmage.html">
    🎮<br>Scrim
  </a>

  <a href="leaderboard.html">
    🏆<br>Rank
  </a>

  <a href="profile.html">
    👤<br>Profile
  </a>

</nav>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>


<script>

let currentUser = null;

let currentUsername = "NØV3X Member";


const status =
  document.getElementById("status");

const messages =
  document.getElementById("messages");

const input =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");


/*
  WAIT FOR FIREBASE
  TO RESTORE SESSION
*/

auth.onAuthStateChanged(async function(user){

  if(!user){

    status.textContent =
      "Session not found.";

    setTimeout(function(){

      window.location.replace(
        "login.html"
      );

    },300);

    return;
  }


  currentUser = user;

  status.textContent =
    "NØV3X CHAT • ONLINE";


  /*
    LOAD USER PROFILE
  */

  try{

    const profile =
      await db
      .collection("users")
      .doc(user.uid)
      .get();


    if(profile.exists){

      const data =
        profile.data();

      currentUsername =
        data.username ||
        "NØV3X Member";

    }

  }
  catch(error){

    console.error(
      "Profile error:",
      error
    );

  }


  /*
    LOAD CHAT
  */

  loadMessages();

});


/*
  REAL-TIME MESSAGES
*/

function loadMessages(){

  db.collection("messages")
    .orderBy("createdAt","asc")
    .limitToLast(100)
    .onSnapshot(

      function(snapshot){

        messages.innerHTML = "";

        if(snapshot.empty){

          messages.innerHTML = `
            <div class="system">
              No messages yet.
            </div>
          `;

          return;
        }


        snapshot.forEach(function(doc){

          const data =
            doc.data();


          const wrapper =
            document.createElement("div");

          wrapper.className =
            "message";


          const header =
            document.createElement("div");

          header.className =
            "messageHeader";


          const username =
            document.createElement("div");

          username.className =
            "username";

          username.textContent =
            data.name ||
            "NØV3X Member";


          const time =
            document.createElement("div");

          time.className =
            "time";


          if(data.createdAt){

            const date =
              data.createdAt.toDate();

            time.textContent =
              date.toLocaleTimeString(
                [],
                {
                  hour:"2-digit",
                  minute:"2-digit"
                }
              );

          }


          const text =
            document.createElement("div");

          text.className =
            "text";

          text.textContent =
            data.text || "";


          header.appendChild(username);

          header.appendChild(time);

          wrapper.appendChild(header);

          wrapper.appendChild(text);

          messages.appendChild(wrapper);

        });


        window.scrollTo(
          0,
          document.body.scrollHeight
        );

      },

      function(error){

        console.error(error);

        messages.innerHTML = `
          <div class="system">
            Unable to load chat.
          </div>
        `;

      }

    );

}


/*
  SEND MESSAGE
*/

async function sendMessage(){

  if(!currentUser){

    return;
  }


  const text =
    input.value.trim();


  if(!text){

    return;
  }


  if(text.length > 500){

    alert(
      "Message is too long."
    );

    return;
  }


  sendButton.disabled = true;

  sendButton.textContent =
    "...";


  try{

    await db
      .collection("messages")
      .add({

        uid:
          currentUser.uid,

        name:
          currentUsername,

        text:
          text,

        createdAt:
          firebase.firestore
          .FieldValue
          .serverTimestamp()

      });


    input.value = "";


  }
  catch(error){

    console.error(error);

    alert(
      "Could not send message: " +
      error.code
    );

  }
  finally{

    sendButton.disabled = false;

    sendButton.textContent =
      "SEND";

    input.focus();

  }

}


/*
  BUTTON
*/

sendButton.addEventListener(
  "click",
  sendMessage
);


/*
  ENTER TO SEND
*/

input.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);

</script>

</body>
</html>
