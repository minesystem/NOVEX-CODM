<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>NØV3X — Chat</title>

<style>
html {
  background:#07000d !important;
}

body {
  margin:0 !important;
  padding:0 0 85px 0 !important;
  min-height:100vh;
  background:#07000d !important;
  color:#fff !important;
  font-family:Arial,sans-serif;
}

* {
  box-sizing:border-box;
}

header {
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:#0d0018 !important;
  border-bottom:1px solid #7520c0;
  position:sticky;
  top:0;
  z-index:10;
}

.logo {
  color:#c77dff;
  font-size:24px;
  font-weight:900;
  letter-spacing:2px;
}

.bell {
  width:43px;
  height:43px;
  border:0;
  border-radius:50%;
  background:#1a0029;
  color:white;
  font-size:20px;
}

.container {
  width:100%;
  max-width:700px;
  margin:auto;
  padding:18px;
}

.title {
  color:white;
  font-size:25px;
  font-weight:900;
}

.subtitle {
  color:#a88bb8;
  font-size:13px;
  margin-top:4px;
  margin-bottom:18px;
}

.chat-box {
  width:100%;
  min-height:55vh;
  max-height:62vh;
  overflow-y:auto;
  padding:12px;
  background:#0d0017 !important;
  border:1px solid #451067;
  border-radius:15px;
}

.message {
  margin-bottom:12px;
  padding:11px 13px;
  background:#160022 !important;
  border:1px solid #321044;
  border-radius:12px;
}

.message.mine {
  background:#250039 !important;
  border-color:#842bd1;
}

.name {
  color:#c77dff;
  font-weight:bold;
  font-size:13px;
  margin-bottom:4px;
}

.text {
  color:#fff !important;
  font-size:14px;
  white-space:pre-wrap;
  word-break:break-word;
}

.time {
  color:#80668d;
  font-size:10px;
  margin-top:5px;
}

.delete-btn {
  margin-top:5px;
  border:0;
  background:none;
  color:#ff5c7a;
  font-size:11px;
}

.empty {
  padding:35px 10px;
  text-align:center;
  color:#806b8d;
}

.input-area {
  display:flex;
  gap:8px;
  margin-top:12px;
}

textarea {
  flex:1;
  height:50px;
  resize:none;
  padding:14px;
  border-radius:12px;
  border:1px solid #4a146d;
  outline:none;
  background:#100019 !important;
  color:#fff !important;
  font-size:14px;
}

textarea::placeholder {
  color:#806b8d;
}

textarea:focus {
  border-color:#a13cff;
}

.send {
  width:70px;
  border:0;
  border-radius:12px;
  background:#7624b8;
  color:#fff;
  font-weight:bold;
}

.bottom-nav {
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:68px;
  background:#0d0018 !important;
  border-top:1px solid #451067;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:50;
}

.nav-item {
  text-decoration:none;
  color:#806b8d;
  text-align:center;
  font-size:11px;
}

.nav-item.active {
  color:#c77dff;
}

.nav-icon {
  display:block;
  font-size:21px;
  margin-bottom:2px;
}

.notification-badge {
  position:absolute;
  top:-3px;
  right:-3px;
  min-width:18px;
  height:18px;
  display:none;
  align-items:center;
  justify-content:center;
  background:#ff1744;
  color:white;
  border:2px solid #0d0018;
  border-radius:20px;
  font-size:10px;
  font-weight:bold;
}

.header-right {
  position:relative;
}

.notification-overlay {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  z-index:100;
  padding:20px;
}

.notification-modal {
  max-width:500px;
  max-height:75vh;
  margin:50px auto;
  overflow:hidden;
  background:#100019;
  border:1px solid #7020a8;
  border-radius:18px;
}

.notification-header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:17px;
  border-bottom:1px solid #351047;
}

.notification-header h2 {
  margin:0;
  font-size:18px;
}

.close-btn,
.mark-all {
  border:0;
  background:none;
  color:#c77dff;
}

.close-btn {
  color:white;
  font-size:22px;
}

.mark-all {
  padding:10px 17px;
  font-size:11px;
}

.notification-list {
  max-height:58vh;
  overflow-y:auto;
}

.notification-item {
  padding:15px 17px;
  border-top:1px solid #291034;
}

.notification-item.unread {
  background:#190025;
}

.notification-title {
  color:#d59aff;
  font-weight:bold;
}

.notification-text {
  color:#eee0f5;
  font-size:13px;
  margin-top:5px;
}

.notification-time {
  color:#75617e;
  font-size:10px;
  margin-top:6px;
}
</style>
</head>

<body>

<header>

  <div class="logo">
    NØV3X
  </div>

  <div class="header-right">

    <button class="bell"
            onclick="openNotifications()">
      🔔
    </button>

    <span id="notificationBadge"
          class="notification-badge">
      0
    </span>

  </div>

</header>

<main class="container">

  <div class="title">
    NØV3X CHAT
  </div>

  <div class="subtitle">
    ONE SQUAD, ONE FATE
  </div>

  <div id="chatBox"
       class="chat-box">

    <div class="empty">
      Loading chat...
    </div>

  </div>

  <div class="input-area">

    <textarea
      id="messageInput"
      maxlength="500"
      placeholder="Type a message..."></textarea>

    <button class="send"
            onclick="sendMessage()">
      SEND
    </button>

  </div>

</main>

<div id="notificationOverlay"
     class="notification-overlay">

  <div class="notification-modal">

    <div class="notification-header">

      <h2>
        🔔 Notifications
      </h2>

      <button class="close-btn"
              onclick="closeNotifications()">
        ×
      </button>

    </div>

    <button class="mark-all"
            onclick="markAllRead()">
      Mark all as read
    </button>

    <div id="notificationList"
         class="notification-list">

      <div class="empty">
        Loading notifications...
      </div>

    </div>

  </div>

</div>

<!-- FINAL 5-TAB NAVIGATION -->

<nav class="bottom-nav">

  <a class="nav-item"
     href="index.html">

    <span class="nav-icon">
      🏠
    </span>

    Home

  </a>

  <a class="nav-item active"
     href="chat.html">

    <span class="nav-icon">
      💬
    </span>

    Chat

  </a>

  <a class="nav-item"
     href="scrimmage.html">

    <span class="nav-icon">
      🎮
    </span>

    Scrim

  </a>

  <a class="nav-item"
     href="leaderboard.html">

    <span class="nav-icon">
      🏆
    </span>

    Rank

  </a>

  <a class="nav-item"
     href="profile.html">

    <span class="nav-icon">
      👤
    </span>

    Profile

  </a>

</nav>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>

let currentUser = null;
let currentUsername = "Player";
let notificationCache = [];


/* =========================
   AUTH
========================= */

auth.onAuthStateChanged(async user => {

  if (!user) {

    location.href = "login.html";

    return;
  }

  currentUser = user;

  try {

    const profile =
      await db
        .collection("users")
        .doc(user.uid)
        .get();

    if (profile.exists) {

      currentUsername =
        profile.data().username || "Player";

    }

    loadMessages();
    startNotifications();

  } catch(error) {

    console.error(error);

    document.getElementById("chatBox").innerHTML =
      '<div class="empty">Firebase connection error.</div>';

  }

});


/* =========================
   CHAT
========================= */

function loadMessages() {

  db.collection("messages")
    .orderBy("createdAt", "desc")
    .limit(100)
    .onSnapshot(snapshot => {

      const box =
        document.getElementById("chatBox");

      box.innerHTML = "";

      if (snapshot.empty) {

        box.innerHTML =
          '<div class="empty">No messages yet.</div>';

        return;
      }

      snapshot.docs.reverse().forEach(doc => {

        const data = doc.data();

        const message =
          document.createElement("div");

        message.className = "message";

        if (data.uid === currentUser.uid) {

          message.classList.add("mine");

        }

        const name =
          document.createElement("div");

        name.className = "name";

        name.textContent =
          data.username || "Player";


        const text =
          document.createElement("div");

        text.className = "text";

        text.textContent =
          data.text || "";


        const time =
          document.createElement("div");

        time.className = "time";

        if (data.createdAt) {

          time.textContent =
            formatTime(
              data.createdAt.toDate()
            );

        }


        message.appendChild(name);
        message.appendChild(text);
        message.appendChild(time);


        if (data.uid === currentUser.uid) {

          const del =
            document.createElement("button");

          del.className =
            "delete-btn";

          del.textContent =
            "Delete";

          del.onclick = () =>
            deleteMessage(doc.id);

          message.appendChild(del);

        }


        box.appendChild(message);

      });

      box.scrollTop =
        box.scrollHeight;

    }, error => {

      console.error(error);

      document.getElementById("chatBox").innerHTML =
        '<div class="empty">Unable to load chat.</div>';

    });

}


async function sendMessage() {

  if (!currentUser) return;

  const input =
    document.getElementById("messageInput");

  const text =
    input.value.trim();

  if (!text) return;


  if (text.length > 500) {

    alert("Message is too long.");

    return;
  }


  try {

    await db
      .collection("messages")
      .add({

        uid:
          currentUser.uid,

        username:
          currentUsername,

        text:
          text,

        createdAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp()

      });

    input.value = "";

  } catch(error) {

    console.error(error);

    alert(
      "Failed to send message."
    );

  }

}


async function deleteMessage(id) {

  try {

    await db
      .collection("messages")
      .doc(id)
      .delete();

  } catch(error) {

    console.error(error);

    alert(
      "Failed to delete message."
    );

  }

}


function formatTime(date) {

  return date.toLocaleString([], {

    month:"short",

    day:"numeric",

    hour:"numeric",

    minute:"2-digit"

  });

}


/* =========================
   ENTER TO SEND
========================= */

document
  .getElementById("messageInput")
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* =========================
   NOTIFICATIONS
========================= */

function startNotifications() {

  db.collection("notifications")
    .orderBy("createdAt", "desc")
    .limit(50)
    .onSnapshot(snapshot => {

      notificationCache =
        snapshot.docs;

      let unread = 0;


      snapshot.forEach(doc => {

        const data =
          doc.data();

        const readBy =
          data.readBy || [];


        if (
          !readBy.includes(
            currentUser.uid
          )
        ) {

          unread++;

        }

      });


      const badge =
        document.getElementById(
          "notificationBadge"
        );


      if (unread > 0) {

        badge.textContent =
          unread > 99
            ? "99+"
            : unread;

        badge.style.display =
          "flex";

      } else {

        badge.style.display =
          "none";

      }

    }, error => {

      console.error(
        "Notification error:",
        error
      );

    });

}


function openNotifications() {

  document.getElementById(
    "notificationOverlay"
  ).style.display =
    "block";

  loadNotifications();

}


function closeNotifications() {

  document.getElementById(
    "notificationOverlay"
  ).style.display =
    "none";

}


function loadNotifications() {

  const list =
    document.getElementById(
      "notificationList"
    );

  list.innerHTML = "";


  if (
    notificationCache.length === 0
  ) {

    list.innerHTML =
      '<div class="empty">No notifications.</div>';

    return;

  }


  notificationCache.forEach(doc => {

    const data =
      doc.data();

    const item =
      document.createElement("div");

    item.className =
      "notification-item";


    const readBy =
      data.readBy || [];


    if (
      !readBy.includes(
        currentUser.uid
      )
    ) {

      item.classList.add(
        "unread"
      );

    }


    const title =
      document.createElement("div");

    title.className =
      "notification-title";

    title.textContent =
      data.title || "NØV3X";


    const text =
      document.createElement("div");

    text.className =
      "notification-text";

    text.textContent =
      data.text || "";


    item.appendChild(title);
    item.appendChild(text);


    item.onclick = () =>
      markNotificationRead(
        doc.id
      );


    list.appendChild(item);

  });

}


async function markNotificationRead(id) {

  try {

    await db
      .collection("notifications")
      .doc(id)
      .update({

        readBy:
          firebase.firestore
            .FieldValue
            .arrayUnion(
              currentUser.uid
            )

      });

  } catch(error) {

    console.error(error);

  }

}


async function markAllRead() {

  const batch =
    db.batch();


  notificationCache.forEach(doc => {

    const data =
      doc.data();

    const readBy =
      data.readBy || [];


    if (
      !readBy.includes(
        currentUser.uid
      )
    ) {

      batch.update(
        doc.ref,
        {

          readBy:
            firebase.firestore
              .FieldValue
              .arrayUnion(
                currentUser.uid
              )

        }
      );

    }

  });


  try {

    await batch.commit();

    loadNotifications();

  } catch(error) {

    console.error(error);

  }

}


document
  .getElementById(
    "notificationOverlay"
  )
  .addEventListener(
    "click",
    event => {

      if (
        event.target.id ===
        "notificationOverlay"
      ) {

        closeNotifications();

      }

    }
  );

</script>

</body>
</html>
