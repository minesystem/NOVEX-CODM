<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NØV3X — Profile</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #08060d;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      padding-bottom: 85px;
    }

    header {
      text-align: center;
      padding: 25px 15px;
      background: #0d0915;
      border-bottom: 1px solid #29183b;
    }

    header h1 {
      color: #b66cff;
      letter-spacing: 4px;
      font-size: 28px;
    }

    header p {
      color: #817589;
      font-size: 12px;
      margin-top: 5px;
    }

    .container {
      width: 94%;
      max-width: 600px;
      margin: 25px auto;
    }

    .profile-card {
      background: #100b18;
      border: 1px solid #2b193e;
      border-radius: 18px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 0 25px rgba(145, 61, 255, 0.08);
    }

    .avatar {
      width: 82px;
      height: 82px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: linear-gradient(135deg, #762cff, #bd70ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      color: white;
    }

    #username {
      font-size: 23px;
      font-weight: bold;
    }

    #email {
      color: #817589;
      font-size: 13px;
      margin-top: 6px;
      word-break: break-word;
    }

    .role {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 13px;
      border-radius: 20px;
      background: #21102f;
      color: #bd79ff;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .section {
      margin-top: 18px;
      background: #100b18;
      border: 1px solid #2b193e;
      border-radius: 15px;
      padding: 18px;
    }

    .section h3 {
      color: #b66cff;
      margin-bottom: 14px;
      font-size: 16px;
    }

    .info {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 11px 0;
      border-bottom: 1px solid #21162d;
      font-size: 13px;
    }

    .info:last-child {
      border-bottom: none;
    }

    .info span:first-child {
      color: #817589;
    }

    .info span:last-child {
      text-align: right;
      word-break: break-word;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #8b3dff;
      color: white;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #9d58ff;
    }

    .admin-btn {
      background: #241034;
      border: 1px solid #6f35a5;
      color: #c98cff;
    }

    .admin-btn:hover {
      background: #321647;
    }

    .loading {
      text-align: center;
      color: #a85cff;
      padding: 40px;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: #0d0915;
      border-top: 1px solid #29183b;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
    }

    nav a {
      text-decoration: none;
      color: #817589;
      font-size: 11px;
      text-align: center;
    }

    nav a.active {
      color: #b66cff;
    }

    nav div {
      font-size: 21px;
      margin-bottom: 3px;
    }
  </style>
</head>

<body>

  <header>
    <h1>NØV3X</h1>
    <p>ONE SQUAD, ONE FATE</p>
  </header>

  <main class="container">

    <div id="loading" class="loading">
      Loading profile...
    </div>

    <div id="profile" style="display:none;">

      <div class="profile-card">

        <div class="avatar" id="avatar">
          N
        </div>

        <div id="username">Loading...</div>
        <div id="email">Loading...</div>

        <div class="role" id="role">
          PLAYER
        </div>

      </div>

      <div class="section">

        <h3>ACCOUNT INFO</h3>

        <div class="info">
          <span>Username</span>
          <span id="infoUsername">—</span>
        </div>

        <div class="info">
          <span>Email</span>
          <span id="infoEmail">—</span>
        </div>

        <div class="info">
          <span>Role</span>
          <span id="infoRole">—</span>
        </div>

      </div>

      <button
        id="adminButton"
        class="admin-btn"
        style="display:none;"
        onclick="location.href='admin.html'">
        ⚙ ADMIN CONTROL CENTER
      </button>

      <button onclick="logout()">
        LOG OUT
      </button>

    </div>

  </main>

  <nav>

    <a href="index.html">
      <div>⌂</div>
      Home
    </a>

    <a href="chat.html">
      <div>💬</div>
      Chat
    </a>

    <a href="scrimmage.html">
      <div>⚔</div>
      Scrim
    </a>

    <a href="leaderboard.html">
      <div>🏆</div>
      Rank
    </a>

    <a href="profile.html" class="active">
      <div>👤</div>
      Profile
    </a>

  </nav>

  <script>

    const loading = document.getElementById("loading");
    const profile = document.getElementById("profile");

    auth.onAuthStateChanged(async (user) => {

      if (!user) {
        window.location.href = "login.html";
        return;
      }

      try {

        const doc = await db
          .collection("users")
          .doc(user.uid)
          .get();

        let username = "NØV3X Player";
        let role = "player";

        if (doc.exists) {
          const data = doc.data();

          username = data.username || username;
          role = data.role || "player";
        }

        document.getElementById("username").textContent = username;
        document.getElementById("email").textContent = user.email || "";

        document.getElementById("infoUsername").textContent = username;
        document.getElementById("infoEmail").textContent = user.email || "—";
        document.getElementById("infoRole").textContent = role.toUpperCase();

        document.getElementById("role").textContent = role.toUpperCase();

        const firstLetter =
          username.trim().charAt(0).toUpperCase() || "N";

        document.getElementById("avatar").textContent = firstLetter;

        if (role === "admin") {
          document.getElementById("adminButton").style.display = "block";
        }

        loading.style.display = "none";
        profile.style.display = "block";

      } catch (error) {

        console.error(error);

        loading.innerHTML =
          "Unable to load profile.<br><br>" +
          error.message;
      }

    });

    async function logout() {

      try {

        await auth.signOut();

        window.location.href = "login.html";

      } catch (error) {

        alert(error.message);

      }

    }

  </script>

</body>
</html>
