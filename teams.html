<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NØV3X — Teams</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #08060d;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      padding-bottom: 85px;
    }

    header {
      text-align: center;
      padding: 24px 15px;
      background: #0d0915;
      border-bottom: 1px solid #29183b;
    }

    header h1 {
      color: #b66cff;
      letter-spacing: 4px;
      font-size: 28px;
    }

    header p {
      color: #817589;
      font-size: 12px;
      margin-top: 5px;
    }

    .container {
      width: 94%;
      max-width: 650px;
      margin: 22px auto;
    }

    .section {
      background: #100b18;
      border: 1px solid #2b193e;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .section h2 {
      font-size: 19px;
      margin-bottom: 15px;
    }

    .section h2 span {
      color: #b66cff;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 11px;
      border: 1px solid #38204e;
      background: #0b0810;
      color: white;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #9b4dff;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 11px;
      background: #8b3dff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #a05bff;
    }

    .team-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 15px;
      background: #0c0911;
      border: 1px solid #29183b;
      border-radius: 13px;
    }

    .team-logo {
      width: 45px;
      height: 45px;
      border-radius: 10px;
      background: #21102f;
      color: #c084ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .team-info {
      flex: 1;
      min-width: 0;
    }

    .team-name {
      font-weight: bold;
      font-size: 15px;
      word-break: break-word;
    }

    .team-owner {
      color: #766b80;
      font-size: 11px;
      margin-top: 4px;
    }

    .delete-btn {
      width: auto;
      padding: 8px 10px;
      background: #24101f;
      color: #ff78c8;
      border: 1px solid #5c214d;
      font-size: 11px;
    }

    .delete-btn:hover {
      background: #35152d;
    }

    .empty {
      text-align: center;
      color: #766b80;
      padding: 25px 10px;
    }

    .loading {
      text-align: center;
      color: #a85cff;
      padding: 25px;
    }

    #message {
      text-align: center;
      font-size: 12px;
      margin-top: 10px;
      color: #a85cff;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: #0d0915;
      border-top: 1px solid #29183b;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
    }

    nav a {
      text-decoration: none;
      color: #817589;
      font-size: 11px;
      text-align: center;
    }

    nav a.active {
      color: #b66cff;
    }

    nav div {
      font-size: 21px;
      margin-bottom: 3px;
    }
  </style>
</head>

<body>

  <header>
    <h1>NØV3X</h1>
    <p>ONE SQUAD, ONE FATE</p>
  </header>

  <main class="container">

    <div class="section">

      <h2>➕ <span>CREATE TEAM</span></h2>

      <input
        id="teamName"
        type="text"
        maxlength="40"
        placeholder="Enter team name"
      >

      <button onclick="createTeam()">
        CREATE TEAM
      </button>

      <div id="message"></div>

    </div>

    <div class="section">

      <h2>👥 <span>NØV3X TEAMS</span></h2>

      <div id="teamList" class="team-list">
        <div class="loading">
          Loading teams...
        </div>
      </div>

    </div>

  </main>

  <nav>

    <a href="index.html">
      <div>⌂</div>
      Home
    </a>

    <a href="chat.html">
      <div>💬</div>
      Chat
    </a>

    <a href="scrimmage.html">
      <div>⚔</div>
      Scrim
    </a>

    <a href="leaderboard.html">
      <div>🏆</div>
      Rank
    </a>

    <a href="profile.html">
      <div>👤</div>
      Profile
    </a>

  </nav>

  <script>

    const teamList = document.getElementById("teamList");
    const message = document.getElementById("message");

    let currentUser = null;
    let currentRole = "player";

    auth.onAuthStateChanged(async (user) => {

      if (!user) {
        window.location.href = "login.html";
        return;
      }

      currentUser = user;

      try {

        const userDoc = await db
          .collection("users")
          .doc(user.uid)
          .get();

        if (userDoc.exists) {
          currentRole = userDoc.data().role || "player";
        }

        loadTeams();

      } catch (error) {

        console.error(error);
        loadTeams();

      }

    });

    function loadTeams() {

      db.collection("teams")
        .onSnapshot(
          (snapshot) => {

            teamList.innerHTML = "";

            if (snapshot.empty) {

              teamList.innerHTML = `
                <div class="empty">
                  No teams yet.
                </div>
              `;

              return;
            }

            snapshot.forEach((doc) => {

              const data = doc.data();

              const name = data.name || "Unnamed Team";
              const owner = data.ownerName || "Unknown";
              const ownerUid = data.ownerUid || "";

              const firstLetter =
                name.trim().charAt(0).toUpperCase() || "N";

              const team = document.createElement("div");
              team.className = "team";

              let deleteButton = "";

              if (
                currentUser &&
                (
                  ownerUid === currentUser.uid ||
                  currentRole === "admin"
                )
              ) {

                deleteButton = `
                  <button
                    class="delete-btn"
                    onclick="deleteTeam('${doc.id}')">
                    DELETE
                  </button>
                `;
              }

              team.innerHTML = `
                <div class="team-logo">
                  ${escapeHTML(firstLetter)}
                </div>

                <div class="team-info">
                  <div class="team-name">
                    ${escapeHTML(name)}
                  </div>

                  <div class="team-owner">
                    Owner: ${escapeHTML(owner)}
                  </div>
                </div>

                ${deleteButton}
              `;

              teamList.appendChild(team);

            });

          },

          (error) => {

            console.error(error);

            teamList.innerHTML = `
              <div class="empty">
                Failed to load teams.
                <br><br>
                ${escapeHTML(error.message)}
              </div>
            `;

          }
        );

    }

    async function createTeam() {

      if (!currentUser) return;

      const input = document.getElementById("teamName");
      const name = input.value.trim();

      if (!name) {

        message.textContent = "Enter a team name.";
        return;

      }

      if (name.length < 2) {

        message.textContent = "Team name is too short.";
        return;

      }

      try {

        message.textContent = "Creating team...";

        const userDoc = await db
          .collection("users")
          .doc(currentUser.uid)
          .get();

        const username =
          userDoc.exists
            ? userDoc.data().username || currentUser.email
            : currentUser.email;

        await db.collection("teams").add({

          name: name,
          ownerUid: currentUser.uid,
          ownerName: username,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()

        });

        input.value = "";

        message.textContent = "Team created successfully!";

        setTimeout(() => {
          message.textContent = "";
        }, 2000);

      } catch (error) {

        console.error(error);
        message.textContent = error.message;

      }

    }

    async function deleteTeam(teamId) {

      if (!currentUser) return;

      const confirmed = confirm(
        "Delete this team?"
      );

      if (!confirmed) return;

      try {

        await db
          .collection("teams")
          .doc(teamId)
          .delete();

      } catch (error) {

        alert(error.message);

      }

    }

    function escapeHTML(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

  </script>

</body>
</html>
