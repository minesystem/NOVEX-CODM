<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NØV3X — Admin Panel</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#07000d;
 color:white;
 font-family:Arial,sans-serif;
 padding-bottom:80px;
}

header{
 padding:22px 18px;
 border-bottom:1px solid #321650;
 background:#0d0015;
}

.logo{
 color:#c56cff;
 font-size:27px;
 font-weight:900;
 letter-spacing:3px;
}

.sub{
 color:#806b8d;
 font-size:12px;
 margin-top:5px;
}

.container{
 max-width:700px;
 margin:auto;
 padding:18px;
}

.card{
 background:#100019;
 border:1px solid #321650;
 border-radius:15px;
 padding:16px;
 margin-bottom:15px;
}

.card h2{
 margin:0 0 13px;
 font-size:17px;
 color:#d39aff;
}

button{
 border:0;
 border-radius:9px;
 padding:11px 14px;
 margin:4px;
 background:#7628c8;
 color:white;
 font-weight:bold;
}

button.danger{
 background:#a51f3c;
}

button.dark{
 background:#24102f;
}

input{
 width:100%;
 padding:12px;
 margin:5px 0;
 border-radius:9px;
 border:1px solid #3b1854;
 background:#08000f;
 color:white;
 outline:none;
}

.slot{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 padding:11px;
 margin:6px 0;
 background:#08000f;
 border:1px solid #291039;
 border-radius:9px;
}

.slot-info{
 flex:1;
}

.slot-number{
 color:#b968ff;
 font-weight:bold;
}

.slot-team{
 margin-top:3px;
 font-size:13px;
}

.open{
 color:#777;
}

.claimed{
 color:#fff;
}

.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
}

.stat{
 background:#08000f;
 border:1px solid #291039;
 border-radius:10px;
 padding:13px;
 text-align:center;
}

.stat b{
 display:block;
 color:#c56cff;
 font-size:22px;
}

.stat span{
 color:#806b8d;
 font-size:10px;
}

.message{
 min-height:18px;
 margin:8px 0;
 color:#b968ff;
 font-size:12px;
}

nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:65px;
 background:#0d0015;
 border-top:1px solid #321650;
 display:flex;
 justify-content:space-around;
 align-items:center;
}

nav a{
 color:#806b8d;
 text-decoration:none;
 font-size:11px;
 text-align:center;
}

nav a.active{
 color:#c56cff;
}
</style>
</head>

<body>

<header>
 <div class="logo">NØV3X</div>
 <div class="sub">ADMIN CONTROL CENTER</div>
</header>

<div class="container">

 <div id="message" class="message"></div>

 <div class="card">
  <h2>📊 SCRIMMAGE STATUS</h2>

  <div class="stats">
   <div class="stat">
    <b id="totalSlots">25</b>
    <span>TOTAL</span>
   </div>

   <div class="stat">
    <b id="claimedSlots">0</b>
    <span>CLAIMED</span>
   </div>

   <div class="stat">
    <b id="openSlots">25</b>
    <span>OPEN</span>
   </div>
  </div>
 </div>

 <div class="card">

  <h2>🎮 SCRIMMAGE MANAGEMENT</h2>

  <button onclick="initializeSlots()">
   INITIALIZE 25 SLOTS
  </button>

  <button class="danger" onclick="resetSlots()">
   RESET ALL SLOTS
  </button>

  <div id="slots">
   Loading slots...
  </div>

 </div>

 <div class="card">

  <h2>📢 ANNOUNCEMENT</h2>

  <input
   id="announcementText"
   placeholder="Write announcement..."
   maxlength="300">

  <button onclick="postAnnouncement()">
   POST ANNOUNCEMENT
  </button>

 </div>

 <div class="card">

  <h2>🔔 NOTIFICATION</h2>

  <input
   id="notificationText"
   placeholder="Notification message..."
   maxlength="300">

  <button onclick="sendNotification()">
   SEND NOTIFICATION
  </button>

 </div>

 <div class="card">

  <h2>🏆 QUICK LINKS</h2>

  <button onclick="location.href='leaderboard.html'">
   LEADERBOARD
  </button>

  <button onclick="location.href='scrimmage.html'">
   SCRIMMAGE
  </button>

  <button onclick="location.href='teams.html'">
   TEAMS
  </button>

  <button onclick="location.href='chat.html'">
   CHAT
  </button>

 </div>

 <button
  class="danger"
  onclick="logout()"
  style="width:100%;margin:0">
  LOG OUT
 </button>

</div>

<nav>

 <a href="index.html">🏠<br>Home</a>

 <a href="chat.html">💬<br>Chat</a>

 <a href="scrimmage.html">🎮<br>Scrim</a>

 <a href="leaderboard.html">🏆<br>Rank</a>

 <a href="profile.html">👤<br>Profile</a>

</nav>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>

let currentUser=null;

const message=document.getElementById("message");

function showMessage(text){
 message.textContent=text;
}

auth.onAuthStateChanged(async user=>{

 if(!user){
  location.href="login.html";
  return;
 }

 currentUser=user;

 try{

  const snap=await db
   .collection("users")
   .doc(user.uid)
   .get();

  if(!snap.exists || snap.data().role!=="admin"){
   alert("Admin access required.");
   location.href="index.html";
   return;
  }

  loadSlots();

 }catch(error){

  console.error(error);
  showMessage("Admin verification failed.");

 }

});


async function initializeSlots(){

 showMessage("Initializing 25 slots...");

 try{

  const batch=db.batch();

  for(let i=1;i<=25;i++){

   const ref=db
    .collection("scrimmageSlots")
    .doc("slot-"+i);

   batch.set(ref,{
    number:i,
    claimed:false
   },{merge:true});

  }

  await batch.commit();

  showMessage("25 slots initialized successfully.");

  loadSlots();

 }catch(error){

  console.error(error);
  showMessage("ERROR: "+error.code);

 }

}


async function loadSlots(){

 try{

  const snap=await db
   .collection("scrimmageSlots")
   .orderBy("number")
   .get();

  let claimed=0;
  let html="";

  snap.forEach(doc=>{

   const data=doc.data();

   if(data.claimed) claimed++;

   html+=`

    <div class="slot">

     <div class="slot-info">

      <div class="slot-number">
       SLOT ${data.number}
      </div>

      <div class="slot-team ${
       data.claimed ? "claimed":"open"
      }">

       ${
        data.claimed
        ? escapeHTML(data.teamName || "CLAIMED")
        : "OPEN"
       }

      </div>

     </div>

     ${
      data.claimed
      ? `<button
          class="danger"
          onclick="releaseSlot('${doc.id}')">
          RELEASE
         </button>`
      : ""
     }

    </div>

   `;

  });

  document.getElementById("slots").innerHTML =
   html || "No slots initialized.";

  document.getElementById("claimedSlots").textContent=
   claimed;

  document.getElementById("openSlots").textContent=
   Math.max(25-claimed,0);

 }catch(error){

  console.error(error);

  document.getElementById("slots").textContent=
   "Unable to load slots.";

 }

}


async function releaseSlot(id){

 if(!confirm("Release this slot?")) return;

 try{

  await db
   .collection("scrimmageSlots")
   .doc(id)
   .set({
    claimed:false,
    teamName:firebase.firestore.FieldValue.delete(),
    uid:firebase.firestore.FieldValue.delete(),
    username:firebase.firestore.FieldValue.delete(),
    claimedAt:firebase.firestore.FieldValue.delete()
   },{merge:true});

  showMessage("Slot released.");

  loadSlots();

 }catch(error){

  console.error(error);
  showMessage("ERROR: "+error.code);

 }

}


async function resetSlots(){

 if(!confirm(
  "RESET ALL 25 SLOTS? This will remove every team."
 )) return;

 try{

  const batch=db.batch();

  for(let i=1;i<=25;i++){

   const ref=db
    .collection("scrimmageSlots")
    .doc("slot-"+i);

   batch.set(ref,{
    number:i,
    claimed:false,
    teamName:firebase.firestore.FieldValue.delete(),
    uid:firebase.firestore.FieldValue.delete(),
    username:firebase.firestore.FieldValue.delete(),
    claimedAt:firebase.firestore.FieldValue.delete()
   },{merge:true});

  }

  await batch.commit();

  showMessage("All slots reset.");

  loadSlots();

 }catch(error){

  console.error(error);
  showMessage("ERROR: "+error.code);

 }

}


async function postAnnouncement(){

 const text=
  document.getElementById("announcementText")
  .value.trim();

 if(!text){
  showMessage("Enter an announcement.");
  return;
 }

 try{

  await db.collection("announcements").add({

   text:text,

   createdAt:
    firebase.firestore.FieldValue.serverTimestamp(),

   createdBy:currentUser.uid

  });

  document.getElementById("announcementText").value="";

  showMessage("Announcement posted.");

 }catch(error){

  console.error(error);
  showMessage("ERROR: "+error.code);

 }

}


async function sendNotification(){

 const text=
  document.getElementById("notificationText")
  .value.trim();

 if(!text){
  showMessage("Enter a notification.");
  return;
 }

 try{

  await db.collection("notifications").add({

   text:text,

   createdAt:
    firebase.firestore.FieldValue.serverTimestamp(),

   createdBy:currentUser.uid,

   readBy:[]

  });

  document.getElementById("notificationText").value="";

  showMessage("Notification sent.");

 }catch(error){

  console.error(error);
  showMessage("ERROR: "+error.code);

 }

}


function escapeHTML(text){

 const div=document.createElement("div");

 div.textContent=text;

 return div.innerHTML;

}


async function logout(){

 await auth.signOut();

 location.href="login.html";

}

</script>

</body>
</html>
