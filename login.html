<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>NØV3X — Login</title>

<style>
* {
  box-sizing:border-box;
}

html,body {
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#07000d;
  color:#fff;
  font-family:Arial,sans-serif;
}

body {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.box {
  width:100%;
  max-width:400px;
  padding:28px;
  background:#100019;
  border:1px solid #542677;
  border-radius:20px;
  box-shadow:0 0 30px rgba(130,40,220,.15);
}

.logo {
  text-align:center;
  color:#c77dff;
  font-size:32px;
  font-weight:900;
  letter-spacing:4px;
}

.subtitle {
  text-align:center;
  color:#81768c;
  font-size:12px;
  margin:7px 0 25px;
}

.tabs {
  display:flex;
  gap:4px;
  margin-bottom:20px;
  padding:4px;
  background:#08000f;
  border-radius:10px;
}

.tabs button {
  flex:1;
  border:0;
  padding:11px;
  border-radius:8px;
  background:transparent;
  color:#81768c;
  font-weight:bold;
}

.tabs button.active {
  background:#7c2cff;
  color:#fff;
}

.input {
  width:100%;
  padding:14px;
  margin-bottom:10px;
  background:#08000f;
  color:#fff;
  border:1px solid #321650;
  border-radius:10px;
  outline:none;
  font-size:14px;
}

.input:focus {
  border-color:#a448ff;
}

.input::placeholder {
  color:#75617e;
}

.main-btn {
  width:100%;
  padding:14px;
  margin-top:7px;
  border:0;
  border-radius:10px;
  background:linear-gradient(135deg,#7628c8,#a448ff);
  color:#fff;
  font-weight:bold;
  font-size:14px;
}

.guest {
  width:100%;
  margin-top:10px;
  padding:12px;
  background:transparent;
  color:#b44cff;
  border:1px solid #321650;
  border-radius:10px;
  font-weight:bold;
}

.message {
  min-height:20px;
  margin-top:15px;
  text-align:center;
  color:#ff7777;
  font-size:12px;
  line-height:1.5;
  word-break:break-word;
}

.loading {
  display:none;
  margin-top:12px;
  text-align:center;
  color:#806b8d;
  font-size:12px;
}

.status {
  margin-top:12px;
  padding:10px;
  border-radius:8px;
  background:#08000f;
  color:#81768c;
  font-size:11px;
  text-align:center;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">NØV3X</div>

  <div class="subtitle">CODM COMMUNITY</div>

  <div class="tabs">
    <button id="loginTab" class="active" onclick="showLogin()">
      LOGIN
    </button>

    <button id="registerTab" onclick="showRegister()">
      REGISTER
    </button>
  </div>

  <div id="formArea">

    <input
      id="email"
      class="input"
      type="email"
      placeholder="Email"
      autocomplete="email">

    <input
      id="password"
      class="input"
      type="password"
      placeholder="Password"
      autocomplete="current-password">

    <button
      id="submitBtn"
      class="main-btn"
      onclick="login()">
      LOGIN
    </button>

  </div>

  <div id="message" class="message"></div>

  <button class="guest" onclick="guestMode()">
    CONTINUE AS GUEST
  </button>

  <div id="loadingText" class="loading">
    Connecting to NØV3X...
  </div>

  <div id="firebaseStatus" class="status">
    Checking Firebase...
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>

let registerMode = false;

const message =
  document.getElementById("message");

const loadingText =
  document.getElementById("loadingText");

const firebaseStatus =
  document.getElementById("firebaseStatus");


function showLogin() {

  registerMode = false;

  document.getElementById("loginTab")
    .classList.add("active");

  document.getElementById("registerTab")
    .classList.remove("active");

  document.getElementById("formArea").innerHTML = `

    <input
      id="email"
      class="input"
      type="email"
      placeholder="Email"
      autocomplete="email">

    <input
      id="password"
      class="input"
      type="password"
      placeholder="Password"
      autocomplete="current-password">

    <button
      id="submitBtn"
      class="main-btn"
      onclick="login()">
      LOGIN
    </button>

  `;

  clearMessage();
}


function showRegister() {

  registerMode = true;

  document.getElementById("loginTab")
    .classList.remove("active");

  document.getElementById("registerTab")
    .classList.add("active");

  document.getElementById("formArea").innerHTML = `

    <input
      id="username"
      class="input"
      type="text"
      placeholder="Username"
      maxlength="20"
      autocomplete="nickname">

    <input
      id="email"
      class="input"
      type="email"
      placeholder="Email"
      autocomplete="email">

    <input
      id="password"
      class="input"
      type="password"
      placeholder="Password"
      autocomplete="new-password">

    <button
      id="submitBtn"
      class="main-btn"
      onclick="register()">
      CREATE ACCOUNT
    </button>

  `;

  clearMessage();
}


async function register() {

  const username =
    document.getElementById("username").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!username || !email || !password) {
    showError("Fill in all fields.");
    return;
  }

  if (username.length < 2) {
    showError("Username must be at least 2 characters.");
    return;
  }

  if (password.length < 6) {
    showError("Password must be at least 6 characters.");
    return;
  }

  setLoading(true);

  try {

    if (typeof auth === "undefined") {
      throw new Error("Firebase Auth is not initialized.");
    }

    const result =
      await auth.createUserWithEmailAndPassword(
        email,
        password
      );

    await db
      .collection("users")
      .doc(result.user.uid)
      .set({
        username: username,
        email: email,
        role: "player",
        createdAt:
          firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt:
          firebase.firestore.FieldValue.serverTimestamp()
      });

    localStorage.setItem(
      "novexName",
      username
    );

    localStorage.removeItem("novexGuest");

    window.location.href = "index.html";

  } catch(error) {

    console.error(error);

    setLoading(false);

    showError(
      "REGISTER FAILED: " +
      (error.code || error.message || "Unknown error")
    );
  }
}


async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email || !password) {
    showError("Enter your email and password.");
    return;
  }

  setLoading(true);

  try {

    if (typeof auth === "undefined") {
      throw new Error("Firebase Auth is not initialized.");
    }

    await auth.signInWithEmailAndPassword(
      email,
      password
    );

    localStorage.removeItem("novexGuest");

    window.location.href = "index.html";

  } catch(error) {

    console.error(error);

    setLoading(false);

    showError(
      "LOGIN FAILED: " +
      (error.code || error.message || "Unknown error")
    );
  }
}


function guestMode() {

  showError(
    "Please login or create an account to continue."
  );
}


function showError(text) {

  message.style.color = "#ff7777";
  message.textContent = text;
}


function clearMessage() {

  message.textContent = "";
}


function setLoading(state) {

  loadingText.style.display =
    state ? "block" : "none";

  const buttons =
    document.querySelectorAll(
      ".main-btn,.guest,.tabs button"
    );

  buttons.forEach(button => {
    button.disabled = state;
    button.style.opacity =
      state ? ".6" : "1";
  });
}


try {

  if (
    typeof firebase !== "undefined" &&
    typeof auth !== "undefined" &&
    typeof db !== "undefined"
  ) {

    firebaseStatus.textContent =
      "Firebase connected ✓";

    firebaseStatus.style.color =
      "#b86cff";

  } else {

    firebaseStatus.textContent =
      "Firebase failed to initialize";

    firebaseStatus.style.color =
      "#ff7777";
  }

} catch(error) {

  firebaseStatus.textContent =
    "Firebase error: " +
    (error.message || "Unknown error");

}


if (
  typeof auth !== "undefined" &&
  auth.onAuthStateChanged
) {

  auth.onAuthStateChanged(user => {

    if (user) {

      console.log(
        "NØV3X logged in:",
        user.email
      );

    }

  });

}

</script>

</body>
</html>
