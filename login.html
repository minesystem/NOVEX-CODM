<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NØV3X CODM Community</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #241044 0%, #0b0612 45%, #030305 100%);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: rgba(12, 8, 20, 0.96);
      border: 1px solid #6d35a8;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 0 35px rgba(125, 45, 190, 0.25);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 5px;
      margin-bottom: 5px;
    }

    .community {
      text-align: center;
      color: #b9a2d1;
      font-size: 13px;
      letter-spacing: 3px;
      margin-bottom: 30px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: 1px solid #40245c;
      background: #100b18;
      color: #a991b9;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .tab.active {
      background: #7229a8;
      color: white;
      border-color: #9d55d1;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #cdbbdc;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid #43245d;
      background: #08060b;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #9a42d0;
      box-shadow: 0 0 10px rgba(154, 66, 208, 0.2);
    }

    button.submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #69229b, #9b3dd1);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button.submit:disabled {
      opacity: 0.6;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
      min-height: 18px;
      color: #ff7777;
    }

    .success {
      color: #7cffaa;
    }

    .loading {
      color: #cba7e7;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">NØV3X</div>
    <div class="community">CODM COMMUNITY</div>

    <div class="tabs">
      <button class="tab active" id="loginTab">
        LOGIN
      </button>

      <button class="tab" id="registerTab">
        REGISTER
      </button>
    </div>


    <!-- LOGIN -->
    <div class="form active" id="loginForm">

      <label>Email</label>
      <input
        type="email"
        id="loginEmail"
        placeholder="Enter your email"
        autocomplete="email"
      >

      <label>Password</label>
      <input
        type="password"
        id="loginPassword"
        placeholder="Enter your password"
        autocomplete="current-password"
      >

      <button class="submit" id="loginButton">
        LOGIN
      </button>

    </div>


    <!-- REGISTER -->
    <div class="form" id="registerForm">

      <label>Username</label>
      <input
        type="text"
        id="registerUsername"
        placeholder="Enter username"
        maxlength="30"
      >

      <label>Email</label>
      <input
        type="email"
        id="registerEmail"
        placeholder="Enter email"
        autocomplete="email"
      >

      <label>Password</label>
      <input
        type="password"
        id="registerPassword"
        placeholder="Create password"
        minlength="6"
        autocomplete="new-password"
      >

      <button class="submit" id="registerButton">
        CREATE ACCOUNT
      </button>

    </div>

    <div class="message" id="message"></div>

  </div>


  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <!-- YOUR FIREBASE CONFIG -->
  <script src="firebase-config.js"></script>


  <script>

    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");

    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");

    const loginButton = document.getElementById("loginButton");
    const registerButton = document.getElementById("registerButton");

    const message = document.getElementById("message");


    // =========================
    // TABS
    // =========================

    loginTab.onclick = () => {

      loginTab.classList.add("active");
      registerTab.classList.remove("active");

      loginForm.classList.add("active");
      registerForm.classList.remove("active");

      message.textContent = "";
    };


    registerTab.onclick = () => {

      registerTab.classList.add("active");
      loginTab.classList.remove("active");

      registerForm.classList.add("active");
      loginForm.classList.remove("active");

      message.textContent = "";
    };


    // =========================
    // LOGIN
    // =========================

    loginButton.onclick = async () => {

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;


      if (!email || !password) {
        message.textContent = "Please enter email and password.";
        return;
      }


      loginButton.disabled = true;
      loginButton.textContent = "LOGGING IN...";
      message.className = "message loading";
      message.textContent = "Connecting to NØV3X...";


      try {

        await auth.setPersistence(
          firebase.auth.Auth.Persistence.LOCAL
        );

        await auth.signInWithEmailAndPassword(
          email,
          password
        );

        message.className = "message success";
        message.textContent = "Login successful!";


        setTimeout(() => {
          window.location.href = "index.html";
        }, 500);


      } catch (error) {

        console.error(error);

        message.className = "message";

        message.textContent =
          error.message || "Login failed.";

        loginButton.disabled = false;
        loginButton.textContent = "LOGIN";
      }
    };


    // =========================
    // REGISTER
    // =========================

    registerButton.onclick = async () => {

      const username =
        document.getElementById("registerUsername").value.trim();

      const email =
        document.getElementById("registerEmail").value.trim();

      const password =
        document.getElementById("registerPassword").value;


      if (!username || !email || !password) {
        message.textContent = "Please fill in all fields.";
        return;
      }


      if (password.length < 6) {
        message.textContent =
          "Password must be at least 6 characters.";
        return;
      }


      registerButton.disabled = true;
      registerButton.textContent = "CREATING...";
      message.className = "message loading";
      message.textContent = "Creating your NØV3X account...";


      try {

        await auth.setPersistence(
          firebase.auth.Auth.Persistence.LOCAL
        );

        const credential =
          await auth.createUserWithEmailAndPassword(
            email,
            password
          );


        await db
          .collection("users")
          .doc(credential.user.uid)
          .set({

            username: username,

            email: email,

            role: "player",

            createdAt:
              firebase.firestore.FieldValue.serverTimestamp(),

            updatedAt:
              firebase.firestore.FieldValue.serverTimestamp()

          });


        message.className = "message success";
        message.textContent =
          "Account created successfully!";


        setTimeout(() => {
          window.location.href = "index.html";
        }, 700);


      } catch (error) {

        console.error(error);

        message.className = "message";

        message.textContent =
          error.message || "Registration failed.";

        registerButton.disabled = false;
        registerButton.textContent = "CREATE ACCOUNT";
      }
    };


  </script>

</body>
