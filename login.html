<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NØV3X — Login</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#07000d;
  color:white;
  font-family:Arial,sans-serif;
}

.box{
  width:90%;
  max-width:380px;
  padding:28px 22px;
  background:#100019;
  border:1px solid #321650;
  border-radius:18px;
  box-shadow:0 0 30px rgba(150,50,255,.15);
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:900;
  letter-spacing:5px;
  color:#c56cff;
}

.subtitle{
  text-align:center;
  margin-top:6px;
  margin-bottom:25px;
  color:#806b8d;
  font-size:12px;
  letter-spacing:2px;
}

.tabs{
  display:flex;
  gap:6px;
  margin-bottom:18px;
}

.tab{
  flex:1;
  padding:11px;
  border:1px solid #321650;
  border-radius:9px;
  background:#08000f;
  color:#806b8d;
  font-weight:bold;
}

.tab.active{
  background:#7628c8;
  color:white;
}

input{
  width:100%;
  padding:13px;
  margin:6px 0;
  border-radius:9px;
  border:1px solid #321650;
  background:#08000f;
  color:white;
  outline:none;
}

input:focus{
  border-color:#9d45e8;
}

.mainBtn{
  width:100%;
  padding:13px;
  margin-top:12px;
  border:0;
  border-radius:9px;
  background:#7628c8;
  color:white;
  font-weight:bold;
}

.status{
  min-height:20px;
  margin-top:14px;
  text-align:center;
  font-size:12px;
  color:#c56cff;
  word-break:break-word;
}

.loading{
  text-align:center;
  color:#806b8d;
  font-size:12px;
  margin-top:12px;
}

</style>

</head>

<body>

<div class="box">

  <div class="logo">NØV3X</div>

  <div class="subtitle">
    CODM COMMUNITY
  </div>

  <div class="tabs">

    <button
      id="loginTab"
      class="tab active"
      onclick="showLogin()">
      LOGIN
    </button>

    <button
      id="registerTab"
      class="tab"
      onclick="showRegister()">
      REGISTER
    </button>

  </div>


  <div id="usernameBox" style="display:none">

    <input
      id="username"
      type="text"
      placeholder="Username"
      maxlength="30">

  </div>


  <input
    id="email"
    type="email"
    placeholder="Email">


  <input
    id="password"
    type="password"
    placeholder="Password">


  <button
    id="actionButton"
    class="mainBtn"
    onclick="login()">

    LOGIN

  </button>


  <div
    id="status"
    class="status">
  </div>


  <div
    id="loading"
    class="loading"
    style="display:none">

    Checking saved login...

  </div>

</div>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>


<script>

let mode = "login";

const statusBox =
  document.getElementById("status");

const loading =
  document.getElementById("loading");


/*
  WAIT FOR FIREBASE
  BEFORE CHECKING LOGIN
*/

let authReady = false;

auth.setPersistence(
  firebase.auth.Auth.Persistence.LOCAL
)
.then(() => {

  authReady = true;

  console.log(
    "NØV3X login persistence enabled"
  );

})
.catch(error => {

  console.error(
    "Persistence error:",
    error
  );

});


/*
  CHECK SAVED ACCOUNT
*/

auth.onAuthStateChanged(async user => {

  loading.style.display = "block";

  if(!user){

    loading.style.display = "none";

    console.log(
      "No saved Firebase session"
    );

    return;
  }


  console.log(
    "Saved session found:",
    user.email
  );


  /*
    USER IS ALREADY LOGGED IN.
    DON'T SHOW LOGIN AGAIN.
  */

  statusBox.textContent =
    "Session restored. Opening NØV3X...";


  try{

    const profile =
      await db
      .collection("users")
      .doc(user.uid)
      .get();


    if(!profile.exists){

      console.log(
        "Profile does not exist yet."
      );

      location.href =
        "index.html";

      return;
    }


    location.href =
      "index.html";

  }
  catch(error){

    console.error(error);

    location.href =
      "index.html";

  }

});


/*
  LOGIN MODE
*/

function showLogin(){

  mode = "login";

  document
    .getElementById("usernameBox")
    .style.display = "none";

  document
    .getElementById("loginTab")
    .classList.add("active");

  document
    .getElementById("registerTab")
    .classList.remove("active");

  document
    .getElementById("actionButton")
    .textContent = "LOGIN";

  document
    .getElementById("actionButton")
    .onclick = login;

  statusBox.textContent = "";

}


/*
  REGISTER MODE
*/

function showRegister(){

  mode = "register";

  document
    .getElementById("usernameBox")
    .style.display = "block";

  document
    .getElementById("loginTab")
    .classList.remove("active");

  document
    .getElementById("registerTab")
    .classList.add("active");

  document
    .getElementById("actionButton")
    .textContent = "CREATE ACCOUNT";

  document
    .getElementById("actionButton")
    .onclick = register;

  statusBox.textContent = "";

}


/*
  LOGIN
*/

async function login(){

  if(!authReady){

    statusBox.textContent =
      "Firebase is still starting...";

    return;
  }


  const email =
    document
    .getElementById("email")
    .value
    .trim();


  const password =
    document
    .getElementById("password")
    .value;


  if(!email || !password){

    statusBox.textContent =
      "Enter your email and password.";

    return;
  }


  try{

    statusBox.textContent =
      "Logging in...";


    /*
      FORCE LOCAL SESSION
    */

    await auth.setPersistence(
      firebase.auth.Auth.Persistence.LOCAL
    );


    const result =
      await auth
      .signInWithEmailAndPassword(
        email,
        password
      );


    console.log(
      "Login successful:",
      result.user.uid
    );


    statusBox.textContent =
      "Login successful!";


    /*
      onAuthStateChanged will
      handle the redirect.
    */

  }
  catch(error){

    console.error(error);

    statusBox.textContent =
      error.code +
      " — " +
      error.message;

  }

}


/*
  REGISTER
*/

async function register(){

  if(!authReady){

    statusBox.textContent =
      "Firebase is still starting...";

    return;
  }


  const username =
    document
    .getElementById("username")
    .value
    .trim();


  const email =
    document
    .getElementById("email")
    .value
    .trim();


  const password =
    document
    .getElementById("password")
    .value;


  if(!username){

    statusBox.textContent =
      "Enter a username.";

    return;
  }


  if(!email || !password){

    statusBox.textContent =
      "Enter email and password.";

    return;
  }


  if(password.length < 6){

    statusBox.textContent =
      "Password must be at least 6 characters.";

    return;
  }


  try{

    statusBox.textContent =
      "Creating account...";


    await auth.setPersistence(
      firebase.auth.Auth.Persistence.LOCAL
    );


    const result =
      await auth
      .createUserWithEmailAndPassword(
        email,
        password
      );


    /*
      Create Firestore profile
    */

    await db
      .collection("users")
      .doc(result.user.uid)
      .set({

        username:username,

        email:email,

        role:"player",

        createdAt:
          firebase.firestore
          .FieldValue
          .serverTimestamp(),

        updatedAt:
          firebase.firestore
          .FieldValue
          .serverTimestamp()

      });


    statusBox.textContent =
      "Account created!";


  }
  catch(error){

    console.error(error);

    statusBox.textContent =
      error.code +
      " — " +
      error.message;

  }

}

</script>

</body>
</html>
