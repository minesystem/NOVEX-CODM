<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NØV3X CODM Community</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #241044, #0b0612 45%, #030305);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #0c0814;
      border: 1px solid #6d35a8;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 0 35px rgba(125, 45, 190, .25);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 5px;
    }

    .community {
      text-align: center;
      color: #b9a2d1;
      font-size: 13px;
      letter-spacing: 3px;
      margin: 6px 0 30px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: 1px solid #40245c;
      background: #100b18;
      color: #a991b9;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .tab.active {
      background: #7229a8;
      color: white;
      border-color: #9d55d1;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #cdbbdc;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid #43245d;
      background: #08060b;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #9a42d0;
    }

    .submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #69229b, #9b3dd1);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit:disabled {
      opacity: .6;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
      min-height: 18px;
      color: #ff7777;
    }

    .success {
      color: #7cffaa;
    }

    .loading {
      color: #cba7e7;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="logo">NØV3X</div>
  <div class="community">CODM COMMUNITY</div>

  <div class="tabs">

    <button class="tab active" id="loginTab">
      LOGIN
    </button>

    <button class="tab" id="registerTab">
      REGISTER
    </button>

  </div>


  <!-- LOGIN -->

  <div class="form active" id="loginForm">

    <label>Email</label>

    <input
      type="email"
      id="loginEmail"
      placeholder="Enter your email"
    >

    <label>Password</label>

    <input
      type="password"
      id="loginPassword"
      placeholder="Enter your password"
    >

    <button class="submit" id="loginButton">
      LOGIN
    </button>

  </div>


  <!-- REGISTER -->

  <div class="form" id="registerForm">

    <label>Username</label>

    <input
      type="text"
      id="registerUsername"
      placeholder="Enter username"
      maxlength="30"
    >

    <label>Email</label>

    <input
      type="email"
      id="registerEmail"
      placeholder="Enter your email"
    >

    <label>Password</label>

    <input
      type="password"
      id="registerPassword"
      placeholder="Create password"
      minlength="6"
    >

    <button class="submit" id="registerButton">
      CREATE ACCOUNT
    </button>

  </div>


  <div class="message" id="message"></div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>


<script>

const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");

const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");

const loginButton = document.getElementById("loginButton");
const registerButton = document.getElementById("registerButton");

const message = document.getElementById("message");


// ==========================
// SWITCH TABS
// ==========================

loginTab.onclick = () => {

  loginTab.classList.add("active");
  registerTab.classList.remove("active");

  loginForm.classList.add("active");
  registerForm.classList.remove("active");

  message.textContent = "";
};


registerTab.onclick = () => {

  registerTab.classList.add("active");
  loginTab.classList.remove("active");

  registerForm.classList.add("active");
  loginForm.classList.remove("active");

  message.textContent = "";
};


// ==========================
// LOGIN
// ==========================

loginButton.onclick = async () => {

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;


  if (!email || !password) {

    message.textContent =
      "Please enter email and password.";

    return;
  }


  loginButton.disabled = true;

  loginButton.textContent = "LOGGING IN...";

  message.className = "message loading";

  message.textContent =
    "Connecting to NØV3X...";


  try {

    await auth.setPersistence(
      firebase.auth.Auth.Persistence.LOCAL
    );


    await auth.signInWithEmailAndPassword(
      email,
      password
    );


    message.className =
      "message success";

    message.textContent =
      "Login successful!";


    setTimeout(() => {

      window.location.href =
        "index.html";

    }, 500);


  } catch (error) {

    console.error(error);

    message.className =
      "message";

    message.textContent =
      error.message;

    loginButton.disabled = false;

    loginButton.textContent =
      "LOGIN";
  }

};


// ==========================
// CREATE ACCOUNT
// ==========================

registerButton.onclick = async () => {

  const username =
    document.getElementById("registerUsername")
      .value.trim();

  const email =
    document.getElementById("registerEmail")
      .value.trim();

  const password =
    document.getElementById("registerPassword")
      .value;


  if (!username || !email || !password) {

    message.textContent =
      "Please fill in all fields.";

    return;
  }


  if (password.length < 6) {

    message.textContent =
      "Password must be at least 6 characters.";

    return;
  }


  registerButton.disabled = true;

  registerButton.textContent =
    "CREATING...";

  message.className =
    "message loading";

  message.textContent =
    "Creating your NØV3X account...";


  try {

    // CREATE FIREBASE ACCOUNT

    const credential =
      await auth.createUserWithEmailAndPassword(
        email,
        password
      );


    // SAVE USER PROFILE

    await db
      .collection("users")
      .doc(credential.user.uid)
      .set({

        username: username,

        email: email,

        role: "player",

        createdAt: new Date().toISOString(),

        updatedAt: new Date().toISOString()

      });


    message.className =
      "message success";

    message.textContent =
      "Account created successfully!";


    setTimeout(() => {

      window.location.href =
        "index.html";

    }, 700);


  } catch (error) {

    console.error(error);

    message.className =
      "message";

    message.textContent =
      error.message;

    registerButton.disabled = false;

    registerButton.textContent =
      "CREATE ACCOUNT";
  }

};

</script>

</body>
